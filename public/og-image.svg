<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1E1E24"/>
  
  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#FACC15"/>
  
  <!-- Main Text -->
  <text x="600" y="200" font-size="72" font-weight="900" text-anchor="middle" fill="#FACC15" font-family="Inter, sans-serif">
    DevJ
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="300" font-size="48" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif">
    AI Engineer & Full-Stack Developer
  </text>
  
  <!-- Description -->
  <text x="600" y="380" font-size="32" font-weight="400" text-anchor="middle" fill="#D1D5DB" font-family="Inter, sans-serif">
    Generative AI • React • Node.js • Interactive Design
  </text>
  
  <!-- Footer -->
  <text x="600" y="580" font-size="20" font-weight="500" text-anchor="middle" fill="#9CA3AF" font-family="Inter, sans-serif">
    devj.com
  </text>
</svg>
